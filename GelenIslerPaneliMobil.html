<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelen İşler Paneli Mobil | DIGICAD Dental Laboratuvar</title>
<!-- Firebase SDK — DIGICAD Dental Laboratuvar Yönetim Sistemi ile AYNI proje/veri -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f4f8; --surface:#fff; --sidebar:#0c1a2e; --border:#dde3ec;
  --text:#1a2740; --text-soft:#6b7f99; --primary:#1565c0; --primary-light:#e8f0fe;
  --accent:#00b4d8; --success:#00897b; --warning:#f59e0b; --danger:#e53935;
  --radius:14px; --shadow:0 2px 16px rgba(21,101,192,.08); --shadow-lg:0 8px 32px rgba(21,101,192,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* HEADER */
.header{background:linear-gradient(135deg,var(--sidebar),#16324f);color:#fff;padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.h-left{display:flex;align-items:center;gap:14px}
.h-logo{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--primary));border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;box-shadow:0 4px 12px rgba(0,180,216,.35)}
.h-title{font-weight:700;font-size:16px;line-height:1.25}
.h-sub{font-size:11px;color:#93a5c2;font-weight:400;letter-spacing:.5px;margin-top:2px}
.h-right{display:flex;align-items:center;gap:10px}
.conn-dot{width:9px;height:9px;border-radius:50%;background:var(--warning);display:inline-block;margin-right:6px;transition:background .2s}
.conn-dot.online{background:#22c55e}
.conn-label{font-size:11.5px;color:#c5d2e5}

.wrap{max-width:1400px;margin:0 auto;padding:20px 24px 60px}

/* TOOLBAR */
.page-tabs{display:flex;gap:8px;margin-bottom:16px}
.page-tab-btn{padding:12px 20px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:inherit;
  font-weight:700;font-size:13.5px;color:var(--text-soft);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
.page-tab-btn:hover{border-color:var(--primary);color:var(--primary)}
.page-tab-btn.active{background:var(--sidebar);border-color:var(--sidebar);color:#fff}
.page-tab-btn .tab-count{background:rgba(0,0,0,.15);border-radius:20px;padding:2px 8px;font-size:11px}
.page-tab-btn.active .tab-count{background:rgba(255,255,255,.2)}
.page-tab-btn:not(.active) .tab-count{background:var(--primary-light);color:var(--primary)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab-group{display:flex;gap:6px;background:#fff;padding:5px;border-radius:12px;box-shadow:var(--shadow)}
.tab-btn{padding:9px 16px;border-radius:8px;border:none;background:transparent;font-family:inherit;font-weight:700;
  font-size:12.5px;color:var(--text-soft);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(21,101,192,.3)}
.tab-count{background:rgba(255,255,255,.25);border-radius:20px;padding:1px 7px;font-size:10.5px}
.tab-btn:not(.active) .tab-count{background:var(--primary-light);color:var(--primary)}

.filter-group{display:flex;gap:8px;align-items:center;background:#fff;padding:6px;border-radius:12px;box-shadow:var(--shadow)}
.filter-select,.filter-date{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;
  font-size:12.5px;color:var(--text);background:#fff;outline:none}
.filter-select{min-width:150px;cursor:pointer}
.filter-select:focus,.filter-date:focus{border-color:var(--primary)}
.filter-date-sep{color:var(--text-soft);font-size:12px}
.filter-clear{background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:16px;padding:2px 6px}
.filter-clear:hover{color:var(--danger)}

.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:13.5px;background:#fff;outline:none}
.search-box input:focus{border-color:var(--primary)}
.search-box .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.refresh-btn{padding:11px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:inherit;
  font-weight:700;font-size:12.5px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:6px}
.refresh-btn:hover{border-color:var(--primary);color:var(--primary)}

/* TEK SATIRLIK LİSTE TABLOSU */
.list-table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;overflow-x:auto}
.list-table{width:100%;border-collapse:collapse;min-width:920px}
.list-table thead th{text-align:left;font-size:10px;font-weight:700;color:var(--text-soft);text-transform:uppercase;
  letter-spacing:.5px;padding:13px 14px;border-bottom:2px solid #f0f4f8;background:#fafbfc;white-space:nowrap}
.list-table tbody td{padding:12px 14px;border-bottom:1px solid #f0f4f8;font-size:12.5px;color:var(--text);vertical-align:middle;white-space:nowrap}
.list-table tbody tr.row-item{cursor:pointer;transition:background .1s}
.list-table tbody tr.row-item:hover{background:#f7f9fc}
.list-table tbody tr.row-item:last-child td{border-bottom:none}
.cell-patient{font-weight:700}
.cell-doctor{color:var(--primary);font-weight:600}
.cell-teeth{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap!important}
.cell-notes-dot{width:7px;height:7px;border-radius:50%;background:var(--warning);display:inline-block;margin-left:5px;vertical-align:middle}

/* CARD LIST */
.sub-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;
  border-left:4px solid var(--border);transition:box-shadow .15s;cursor:pointer}
.sub-card:hover{box-shadow:var(--shadow-lg)}
.sub-card.status-new{border-left-color:var(--accent)}
.sub-card.status-seen{border-left-color:var(--warning)}
.sub-card.status-done{border-left-color:var(--success)}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sc-main{flex:1;min-width:220px}
.sc-patient{font-weight:800;font-size:15px;color:var(--text)}
.sc-doctor{font-size:12.5px;color:var(--primary);font-weight:600;margin-top:2px}
.sc-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--text-soft)}
.sc-meta span{display:flex;align-items:center;gap:4px}
.sc-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.badge.new{background:var(--accent);color:#fff}
.badge.seen{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.badge.done{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.sc-date{font-size:10.5px;color:var(--text-soft);white-space:nowrap}
.sc-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #f0f4f8}
.sc-files{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.file-chip{font-size:10.5px;padding:3px 9px;border-radius:20px;background:var(--primary-light);color:var(--primary);
  font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.sc-notes{margin-top:8px;font-size:12px;color:var(--text-soft);font-style:italic;max-width:700px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-soft)}
.empty-state .icon{font-size:44px;margin-bottom:10px}
.empty-state h4{font-size:15px;color:var(--text);margin-bottom:4px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;
  z-index:2000;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);transition:max-width .15s}
.modal-box.wide{max-width:760px}

/* SİPARİŞ TAKİP FORMU (ekran görünümü — admin paneliyle aynı tasarım) */
.of-sheet{border:0;padding:0}
.of-head{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;padding-bottom:12px;border-bottom:2px solid #1a2740;margin-bottom:14px}
.of-logo-wrap{text-align:center}
.of-logo{font-size:32px;font-weight:900;color:#1a2740;letter-spacing:1.5px;line-height:1}
.of-name{font-size:9.5px;font-weight:700;color:#1a2740;margin-top:3px;letter-spacing:.5px}
.of-addr{font-size:8px;color:#5a6b7a;margin-top:4px;line-height:1.4}
.of-title{text-align:center;margin-top:6px;font-size:12px;letter-spacing:2px;color:#1a2740;font-weight:700}
.of-tooth-mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 4px;font-family:'JetBrains Mono',monospace}
.of-tooth-row{display:flex;gap:2px;justify-content:center}
.of-tooth-cell{width:18px;height:18px;border-radius:4px;font-size:8.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.of-tooth-cell.sel{background:#1a2740;color:#fff}
.of-tooth-cell.off{background:#f0f4f8;color:#9aa8bd}
.of-row{display:grid;border:1.5px solid #1a2740;margin-bottom:10px}
.of-row-2{grid-template-columns:1fr 1fr}
.of-cell{padding:8px 10px;border-right:1.5px solid #1a2740}
.of-cell:last-child{border-right:none}
.of-lbl{font-size:9.5px;font-weight:700;color:#1a2740;letter-spacing:.6px;margin-bottom:4px}
.of-input{width:100%;border:none;outline:none;font-family:inherit;font-weight:700;color:#1a2740;background:transparent;padding:2px 0}
.of-input.big{font-size:16px;text-align:center}
.mat-list{display:flex;flex-direction:column;gap:5px}
.mat-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#1a2740;cursor:pointer}
.of-notes-box{border:1.5px solid #1a2740;padding:8px 10px}
.of-notes-box textarea{width:100%;border:none;outline:none;font-family:inherit;font-size:12px;font-weight:600;
  resize:vertical;color:#1a2740;background:transparent;line-height:1.5;min-height:70px}
.of-teeth-summary{margin-top:10px;padding:7px 10px;background:#f5f7f9;border-radius:5px;font-size:11px}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);padding:4px 8px;border-radius:8px}
.modal-close:hover{background:#f0f4f8}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.detail-row{display:flex;padding:10px 0;border-bottom:1px solid #f0f4f8;gap:14px}
.detail-row .dr-label{width:130px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.4px;padding-top:2px}
.detail-row .dr-val{flex:1;font-size:13.5px;color:var(--text);line-height:1.5}
.tooth-tags{display:flex;flex-wrap:wrap;gap:5px}
.tooth-tag{background:var(--primary-light);color:var(--primary);font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:11.5px;padding:3px 8px;border-radius:6px}

.field{margin-bottom:14px}
label.f-label{display:block;font-size:11px;font-weight:700;color:var(--text-soft);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13.5px;
  color:var(--text);background:#fff;outline:none}
.inp:focus{border-color:var(--primary)}
.inp[readonly]{background:#f7f9fb;color:var(--text-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* MİNİ DİŞ ŞEMASI (salt okunur önizleme) */
.mini-tooth-chart{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f7f9fb;border:1.5px solid var(--border);
  border-radius:10px;padding:10px 8px;margin-top:6px}
.mini-tc-quad{display:flex;flex-direction:column;gap:3px}
.mini-tc-label{font-size:8.5px;font-weight:700;color:var(--text-soft);text-align:center;letter-spacing:.5px}
.mini-tooth-row{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.mini-tooth{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;color:var(--text-soft);background:#fff;flex-shrink:0}
.mini-tooth.sel{background:var(--primary);border-color:var(--primary);color:#fff}

/* MATERYAL LİSTESİ */
.mat-list{display:flex;flex-direction:column;gap:7px}
.mat-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text)}
.mat-row input{accent-color:var(--primary);width:15px;height:15px}

.btn{padding:10px 18px;border-radius:9px;border:none;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
  transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:linear-gradient(90deg,var(--primary),#1976d2);color:#fff;box-shadow:0 3px 10px rgba(21,101,192,.3)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:#fff;border:1.5px solid #fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:7px 12px;font-size:11.5px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:3000;max-width:90vw}
#toast.success{background:#0f5132}
#toast.error{background:#7a1f1f}
#toast.info{background:#1a2740}

/* LOCK SCREEN */
#lock-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--sidebar),#16324f);z-index:5000;
  display:flex;align-items:center;justify-content:center}
.lock-card{background:#fff;border-radius:20px;padding:36px 32px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lock-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--primary));border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:0 auto 16px;box-shadow:0 6px 18px rgba(0,180,216,.35)}
.lock-title{font-size:16px;font-weight:700;margin-bottom:4px}
.lock-sub{font-size:12px;color:var(--text-soft);margin-bottom:20px}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .15s}
.dot.filled{background:var(--primary);border-color:var(--primary)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num-btn{padding:16px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:inherit;
  font-size:18px;font-weight:700;cursor:pointer;color:var(--text)}
.num-btn:hover{border-color:var(--primary);color:var(--primary)}
.num-btn.wide{grid-column:span 1}
#lock-msg{font-size:12px;color:var(--danger);font-weight:600;min-height:16px;margin-bottom:8px}

.hidden{display:none !important}

/* ═══════════════════════════════════════════════════════════════
   📱 MOBİL — DİK (PORTRAIT) TELEFON EKRANLARI İÇİN
   ═══════════════════════════════════════════════════════════════ */
@media (max-width: 640px) {
  body{font-size:14px}
  .wrap{padding:12px 12px 40px}

  .header{flex-direction:column;align-items:stretch;gap:10px;padding:14px 14px}
  .h-left{gap:10px}
  .h-logo{width:36px;height:36px;font-size:17px}
  .h-title{font-size:15px}
  .h-sub{font-size:10.5px}
  .h-right{justify-content:flex-start}

  /* ÜST SEKMELER (Gelen İşler / İşleme Alınanlar) — sığmazsa kaydırılabilir */
  .page-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .page-tab-btn{flex-shrink:0;white-space:nowrap;font-size:12.5px;padding:9px 14px}

  /* ARAÇ ÇUBUĞU — durum sekmeleri, filtreler, arama alt alta */
  .toolbar{flex-direction:column;align-items:stretch;gap:8px}
  .tab-group{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;width:100%}
  .tab-btn{flex-shrink:0;white-space:nowrap}
  .filter-group{flex-wrap:wrap;width:100%}
  .filter-group select,.filter-group input{flex:1;min-width:120px}
  .search-box{width:100%;min-width:0}
  .refresh-btn{width:100%}

  /* TABLOLAR — yatay kaydırma zaten var, sadece font/dolgu küçültülür */
  table th,table td{padding:8px 8px;font-size:12px}

  /* MODALLAR (Talep Detayı) — ekranın büyük kısmını kaplar */
  .modal-overlay{padding:0}
  .modal-box{max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0}
  .modal-header{padding:14px 16px}
  .modal-body{padding:14px 16px}
  .modal-footer{padding:12px 16px;flex-wrap:wrap}

  /* GİRİŞ / KİLİT EKRANI */
  .numpad{gap:8px}
  .num-btn{padding:14px;font-size:16px}

  /* DOKUNMA HEDEFİ */
  .btn{min-height:38px}
}

@media (max-width: 380px) {
  .wrap{padding:8px 8px 36px}
  .h-title{font-size:13.5px}
  .h-sub{display:none}
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-logo">🦷</div>
    <div class="lock-title">Gelen İşler Paneli</div>
    <div class="lock-sub">DIGICAD Dental Laboratuvarı — Personel Girişi<br>Laboratuvar şifrenizi girin</div>
    <div class="dots" id="lock-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div id="lock-msg"></div>
    <div class="numpad">
      <button class="num-btn" onclick="numPress('1')">1</button>
      <button class="num-btn" onclick="numPress('2')">2</button>
      <button class="num-btn" onclick="numPress('3')">3</button>
      <button class="num-btn" onclick="numPress('4')">4</button>
      <button class="num-btn" onclick="numPress('5')">5</button>
      <button class="num-btn" onclick="numPress('6')">6</button>
      <button class="num-btn" onclick="numPress('7')">7</button>
      <button class="num-btn" onclick="numPress('8')">8</button>
      <button class="num-btn" onclick="numPress('9')">9</button>
      <div></div>
      <button class="num-btn" onclick="numPress('0')">0</button>
      <button class="num-btn" onclick="numBackspace()">⌫</button>
    </div>
  </div>
</div>

<div class="header">
  <div class="h-left">
    <div class="h-logo">📥</div>
    <div>
      <div class="h-title">Gelen İşler Paneli</div>
      <div class="h-sub">DIGICAD Dental Laboratuvar · Hekimden Gelenler</div>
    </div>
  </div>
  <div class="h-right">
    <span class="conn-dot" id="conn-dot"></span>
    <span class="conn-label" id="conn-label">Bağlanıyor…</span>
  </div>
</div>

<div class="wrap">
  <div class="page-tabs">
    <button class="page-tab-btn active" id="page-tab-incoming" onclick="setPageTab('incoming')">📥 Gelen İşler <span class="tab-count" id="cnt-incoming">0</span></button>
    <button class="page-tab-btn" id="page-tab-processed" onclick="setPageTab('processed')">✅ İşleme Alınanlar <span class="tab-count" id="cnt-processed">0</span></button>
  </div>

  <div class="toolbar">
    <div class="tab-group" id="status-subtabs">
      <button class="tab-btn active" data-status="all" onclick="setStatusFilter('all')">Tümü <span class="tab-count" id="cnt-all">0</span></button>
      <button class="tab-btn" data-status="Yeni" onclick="setStatusFilter('Yeni')">🆕 Yeni <span class="tab-count" id="cnt-new">0</span></button>
      <button class="tab-btn" data-status="İncelendi" onclick="setStatusFilter('İncelendi')">👁️ İncelendi <span class="tab-count" id="cnt-seen">0</span></button>
    </div>
    <div class="filter-group">
      <select id="doctor-filter" class="filter-select" onchange="renderList()">
        <option value="">Tüm Hekimler</option>
      </select>
      <input type="date" id="date-from-filter" class="filter-date" onchange="renderList()" title="Başlangıç tarihi">
      <span class="filter-date-sep">—</span>
      <input type="date" id="date-to-filter" class="filter-date" onchange="renderList()" title="Bitiş tarihi">
      <button class="filter-clear" onclick="clearFilters()" title="Filtreleri temizle">✕</button>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="search-input" placeholder="Hekim veya hasta adı ara..." oninput="renderList()">
    </div>
    <button class="refresh-btn" onclick="manualRefreshHint()">🔄 Canlı</button>
  </div>

  <div id="list-container"></div>
</div>

<!-- DETAY / AKTARMA MODALI -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📥 Hekim Talebi Detayı</h3>
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer" id="detail-footer"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  FİREBASE BAĞLANTISI — DIGICAD Dental Laboratuvar Yönetim
//  Sistemi ile AYNI Firebase projesi ve AYNI veri yolu (db/digicad).
//  Bu panel: doctorSubmissions'ı okur/günceller, doctors'ı salt okunur
//  okur (fiyat listesi için), ve onaylanan talepleri pendingJobs'a
//  yazarak MEVCUT "Onay Bekleyen" akışına dahil eder. Diğer verilere
//  (jobs, technicians, payments, vb.) hiç dokunmaz.
// ═══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyBKf0ze58oEbOcSVfPPdqX1ElTaxm7JN8E",
  authDomain: "primer-dental.firebaseapp.com",
  databaseURL: "https://primer-dental-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "primer-dental",
  storageBucket: "primer-dental.firebasestorage.app",
  messagingSenderId: "900268652902",
  appId: "1:900268652902:web:aa35f3475f9aef0ab4b0a7"
};
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();
const WORKSPACE = 'digicad';
const dbRoot = 'db/' + WORKSPACE;

const escHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtDate(d) {
  if (!d) return '-';
  const [y, m, g] = d.split('-');
  return `${g}.${m}.${y}`;
}
// Admin panelindeki Sipariş Formu ile BİREBİR aynı sabitler — tutarlılık için
const FDI_QUADRANTS = {
  ur: [18,17,16,15,14,13,12,11], ul: [21,22,23,24,25,26,27,28],
  br: [48,47,46,45,44,43,42,41], bl: [31,32,33,34,35,36,37,38]
};
const ORDER_MATERIALS = ['ZIRCONIA', 'METAL DESTEKLİ PORSELEN', 'EMAX', 'LAMİNE', 'PMMA', 'TITANIUM'];
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  const icons = {success:'✅', error:'❌', info:'ℹ️'};
  el.innerHTML = `<span>${icons[type]||'•'}</span><span>${msg}</span>`;
  el.className = type; el.style.display = 'flex';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.style.display = 'none', 3500);
}

// ── Kilit Ekranı (mevcut sistemle AYNI 4 haneli laboratuvar şifresi) ──
let lockInput = '';
let dbPass = '0000';
let _unlocked = false;

rtdb.ref(dbRoot + '/pass').once('value').then(snap => {
  dbPass = snap.val() || '0000';
}).catch(() => {});

function updateDots() {
  document.querySelectorAll('#lock-dots .dot').forEach((d,i) => d.classList.toggle('filled', i < lockInput.length));
}
function numPress(n) {
  if (lockInput.length >= 4) return;
  lockInput += n;
  updateDots();
  if (lockInput.length === 4) {
    setTimeout(() => {
      if (lockInput === dbPass) {
        _unlocked = true;
        document.getElementById('lock-screen').style.display = 'none';
        startApp();
      } else {
        document.getElementById('lock-msg').innerText = '❌ Hatalı şifre!';
        lockInput = '';
        updateDots();
      }
    }, 150);
  }
}
function numBackspace() {
  lockInput = lockInput.slice(0, -1);
  document.getElementById('lock-msg').innerText = '';
  updateDots();
}

// ── Uygulama Verisi ──────────────────────────────────────
let submissions = [];   // doctorSubmissions listesi
let doctorsById = {};   // fiyat listesi lookup için
let techniciansById = {}; // "Otomatik Teknisyen" ad çözümlemesi için
let statusFilter = 'all';   // 'all' | 'Yeni' | 'İncelendi'  (sadece "incoming" sayfasında anlamlı)
let pageTab = 'incoming';   // 'incoming' (Gelen İşler) | 'processed' (İşleme Alınanlar)
let _appStarted = false;
let _knownDoctorNames = [];

function startApp() {
  if (_appStarted) return;
  _appStarted = true;

  rtdb.ref('.info/connected').on('value', snap => {
    const online = snap.val() === true;
    document.getElementById('conn-dot').classList.toggle('online', online);
    document.getElementById('conn-label').textContent = online ? 'Canlı bağlantı' : 'Bağlanıyor…';
  });

  rtdb.ref(dbRoot + '/doctors').on('value', snap => {
    const data = snap.val() || {};
    doctorsById = data;
  });

  rtdb.ref(dbRoot + '/technicians').on('value', snap => {
    const data = snap.val() || {};
    techniciansById = data;
  });

  rtdb.ref(dbRoot + '/doctorSubmissions').on('value', snap => {
    const data = snap.val() || {};
    submissions = Object.values(data).sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    updateTabCounts();
    populateDoctorFilter();
    renderList();
    // Açık olan detay modalı varsa güncel veriyle tazele — AMA sipariş formu
    // editörü açıkken bu otomatik yenilemeyi YAPMA: "Onaya Gönder" tam da bu
    // kaydın durumunu değiştirdiği için (Yeni/İncelendi → Aktarıldı) bu dinleyici
    // hemen tetikleniyor ve eskiden formu sıfırlayıp "Yazdır" butonunu iptal
    // ediyordu. Editör görünümündeyken sessizce görmezden gel.
    if (_openDetailId && _currentDetailView === 'detail') {
      const fresh = submissions.find(s => s.id === _openDetailId);
      if (fresh) openDetailModal(_openDetailId, true);
    }
  }, err => {
    console.error('doctorSubmissions okunamadı:', err);
    toast('Bağlantı hatası: ' + err.message, 'error');
  });
}

function manualRefreshHint() {
  toast('Bu panel canlı senkronize — yeni talepler otomatik görünür 🔄', 'info');
}

// ── Hekim filtre listesini, gelen taleplerde geçen isimlerden otomatik kurar ──
function populateDoctorFilter() {
  const names = Array.from(new Set(submissions.map(s => s.doctorName).filter(Boolean)))
    .sort((a,b) => a.localeCompare(b, 'tr'));
  if (JSON.stringify(names) === JSON.stringify(_knownDoctorNames)) return; // gereksiz yeniden çizimi atla
  _knownDoctorNames = names;
  const sel = document.getElementById('doctor-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Tüm Hekimler</option>' +
    names.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');
  if (names.includes(cur)) sel.value = cur;
}

function clearFilters() {
  document.getElementById('doctor-filter').value = '';
  document.getElementById('date-from-filter').value = '';
  document.getElementById('date-to-filter').value = '';
  document.getElementById('search-input').value = '';
  renderList();
}

// ── Ana sayfa sekmesi: Gelen İşler (bekleyen) / İşleme Alınanlar (arşiv) ──
function setPageTab(tab) {
  pageTab = tab;
  document.getElementById('page-tab-incoming').classList.toggle('active', tab === 'incoming');
  document.getElementById('page-tab-processed').classList.toggle('active', tab === 'processed');
  // Durum alt-sekmeleri (Yeni/İncelendi) sadece "Gelen İşler" sayfasında anlamlı
  document.getElementById('status-subtabs').style.display = (tab === 'incoming') ? 'flex' : 'none';
  if (tab === 'processed') statusFilter = 'all';
  renderList();
}

function updateTabCounts() {
  const incoming = submissions.filter(s => s.status !== 'Aktarıldı').length;
  const processed = submissions.filter(s => s.status === 'Aktarıldı').length;
  const yeni = submissions.filter(s => !s.status || s.status === 'Yeni').length;
  const seen = submissions.filter(s => s.status === 'İncelendi').length;
  document.getElementById('cnt-incoming').textContent  = incoming;
  document.getElementById('cnt-processed').textContent = processed;
  document.getElementById('cnt-all').textContent  = incoming;
  document.getElementById('cnt-new').textContent  = yeni;
  document.getElementById('cnt-seen').textContent = seen;
  document.title = (yeni > 0 ? `(${yeni}) ` : '') + 'Gelen İşler Paneli | DIGICAD Dental Laboratuvar';
}

function setStatusFilter(f) {
  statusFilter = f;
  document.querySelectorAll('#status-subtabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.status === f));
  renderList();
}

function statusClass(s) {
  if (!s.status || s.status === 'Yeni') return 'new';
  if (s.status === 'İncelendi') return 'seen';
  return 'done';
}
function statusLabel(s) {
  if (!s.status || s.status === 'Yeni') return '🆕 Yeni';
  if (s.status === 'İncelendi') return '👁️ İncelendi';
  return '✅ İşleme Alındı';
}
function jawLabel(s) {
  if (s.jaw === 'upper') return 'Üst Çene';
  if (s.jaw === 'lower') return 'Alt Çene';
  if (s.jaw === 'both') return 'Üst + Alt Çene';
  return null;
}

function renderList() {
  const el = document.getElementById('list-container');
  const q = (document.getElementById('search-input').value || '').toLocaleLowerCase('tr-TR');
  const doctorFilterVal = document.getElementById('doctor-filter').value;
  const dateFrom = document.getElementById('date-from-filter').value; // "YYYY-MM-DD"
  const dateTo   = document.getElementById('date-to-filter').value;

  // 1) Sayfa sekmesine göre ayır: Gelen İşler = henüz aktarılmamış, İşleme Alınanlar = aktarılmış
  let list = pageTab === 'processed'
    ? submissions.filter(s => s.status === 'Aktarıldı')
    : submissions.filter(s => s.status !== 'Aktarıldı');

  // 2) Gelen İşler sayfasında durum alt-filtresi (Yeni / İncelendi)
  if (pageTab === 'incoming' && statusFilter !== 'all') {
    list = list.filter(s => statusFilter === 'Yeni' ? (!s.status || s.status === 'Yeni') : s.status === statusFilter);
  }

  // 3) Hekim filtresi
  if (doctorFilterVal) list = list.filter(s => s.doctorName === doctorFilterVal);

  // 4) Tarih aralığı filtresi (gönderim tarihine göre)
  if (dateFrom) list = list.filter(s => s.createdAt && s.createdAt.slice(0,10) >= dateFrom);
  if (dateTo)   list = list.filter(s => s.createdAt && s.createdAt.slice(0,10) <= dateTo);

  // 5) Serbest metin arama
  if (q) {
    list = list.filter(s =>
      (s.doctorName||'').toLocaleLowerCase('tr-TR').includes(q) ||
      (s.patient||'').toLocaleLowerCase('tr-TR').includes(q));
  }

  if (!list.length) {
    const msg = pageTab === 'processed'
      ? 'İşleme alınmış (aktarılmış) bir talep bulunamadı.'
      : 'Hekim Portalı üzerinden gönderilen talepler burada listelenir.';
    el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h4>Kayıt bulunamadı</h4><p style="font-size:12px">${msg}</p></div>`;
    return;
  }

  const rows = list.map(s => {
    const teeth = Array.isArray(s.teeth) ? s.teeth.slice().sort((a,b)=>a-b) : [];
    const jaw = jawLabel(s);
    const teethStr = jaw ? `${jaw}${teeth.length ? ': ' + teeth.join(', ') : ''}` : '—';
    const dt = s.createdAt ? new Date(s.createdAt).toLocaleString('tr-TR', {dateStyle:'short', timeStyle:'short'}) : '—';
    const fileCount = Array.isArray(s.files) ? s.files.length : 0;
    const jobTypeList = Array.isArray(s.jobTypes) && s.jobTypes.length
      ? s.jobTypes
      : (s.jobType ? [{ type: s.jobType, qty: teeth.length || 1 }] : []);
    const jobTypeStr = jobTypeList.length
      ? jobTypeList.map(jt => jt.qty > 1 ? `${jt.type} ×${jt.qty}` : jt.type).join(', ')
      : '—';
    return `<tr class="row-item" onclick="openDetailModal(${s.id})">
      <td><span class="badge ${statusClass(s)}">${statusLabel(s)}</span></td>
      <td>${dt}</td>
      <td class="cell-doctor">${escHtml(s.doctorName||'—')}</td>
      <td class="cell-patient">${escHtml(s.patient||'—')}${s.notes ? '<span class="cell-notes-dot" title="Not var"></span>' : ''}</td>
      <td class="cell-teeth" title="${escHtml(jobTypeStr)}">${escHtml(jobTypeStr)}</td>
      <td class="cell-teeth" title="${escHtml(teethStr)}">${escHtml(teethStr)}</td>
      <td>${s.color ? escHtml(s.color) : '—'}</td>
      <td>${fileCount ? fileCount + ' dosya' : '—'}</td>
      <td onclick="event.stopPropagation()">
        ${fileCount ? `<button type="button" class="btn btn-outline btn-sm" onclick="downloadAllSubmissionFiles(${s.id})">📦 İndir</button>` : ''}
        ${s.status !== 'Aktarıldı' ? `<button type="button" class="btn btn-primary btn-sm" onclick="openOrderFormFromList(${s.id})">📝 Sipariş Formuna Aktar</button>` : ''}
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `<div class="list-table-wrap"><table class="list-table">
    <thead><tr>
      <th>Durum</th><th>Tarih</th><th>Hekim</th><th>Hasta</th><th>İş Türü</th><th>Çene / Diş</th><th>Renk</th><th>Dosya</th><th>İşlem</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── Detay Modalı ─────────────────────────────────────────
let _openDetailId = null;
let _currentDetailView = null; // 'detail' | 'orderform' — canlı yenilemenin doğru görünümü koruması için

function openDetailModal(id, silentRefresh) {
  const s = submissions.find(x => x.id === id);
  if (!s) return;
  _openDetailId = id;
  _currentDetailView = 'detail';

  document.querySelector('#detail-modal .modal-header h3').textContent = '📥 Hekim Talebi Detayı';

  const teeth = Array.isArray(s.teeth) ? s.teeth.slice().sort((a,b)=>a-b) : [];
  const jaw = jawLabel(s);
  const dt = s.createdAt ? new Date(s.createdAt).toLocaleString('tr-TR', {dateStyle:'long', timeStyle:'short'}) : '—';
  const files = Array.isArray(s.files) ? s.files : [];

  const body = document.getElementById('detail-body');
  body.innerHTML = `
    <div class="detail-row"><div class="dr-label">Durum</div><div class="dr-val"><span class="badge ${statusClass(s)}">${statusLabel(s)}</span></div></div>
    <div class="detail-row"><div class="dr-label">Hekim</div><div class="dr-val"><b>${escHtml(s.doctorName||'—')}</b></div></div>
    <div class="detail-row"><div class="dr-label">Hasta</div><div class="dr-val"><b>${escHtml(s.patient||'—')}</b></div></div>
    <div class="detail-row"><div class="dr-label">İş Türü</div><div class="dr-val">${(() => {
      const jl = Array.isArray(s.jobTypes) && s.jobTypes.length ? s.jobTypes : (s.jobType ? [{type:s.jobType, qty:teeth.length||1}] : []);
      return jl.length ? jl.map(jt => `<span class="tooth-tag" style="font-family:inherit">${escHtml(jt.type)}${jt.qty>1?` ×${jt.qty}`:''}</span>`).join(' ') : '—';
    })()}</div></div>
    <div class="detail-row"><div class="dr-label">Çene</div><div class="dr-val">${jaw || '—'}</div></div>
    <div class="detail-row"><div class="dr-label">Dişler</div><div class="dr-val">${teeth.length ? `<div class="tooth-tags">${teeth.map(t=>`<span class="tooth-tag">${t}</span>`).join('')}</div>` : '—'}</div></div>
    <div class="detail-row"><div class="dr-label">Diş Rengi</div><div class="dr-val">${s.color ? escHtml(s.color) : '—'}</div></div>
    <div class="detail-row"><div class="dr-label">Notlar</div><div class="dr-val">${s.notes ? escHtml(s.notes) : '—'}</div></div>
    <div class="detail-row"><div class="dr-label">Tarama Dosyaları</div><div class="dr-val">${
      files.length
        ? files.map(f => `<a href="${escHtml(f.url)}" target="_blank" rel="noopener" class="file-chip">📎 ${escHtml(f.name)}</a>`).join(' ') +
          `<div style="margin-top:8px"><button class="btn btn-outline btn-sm" onclick="downloadAllSubmissionFiles(${s.id})">📦 Tümünü Klasöre İndir</button></div>`
        : '—'
    }</div></div>
    <div class="detail-row"><div class="dr-label">Gönderim Tarihi</div><div class="dr-val" style="font-size:12px;color:var(--text-soft)">${dt}</div></div>
    ${s.status === 'Aktarıldı' ? `<div class="detail-row"><div class="dr-label">Aktarılma</div><div class="dr-val" style="font-size:12px;color:var(--text-soft)">${s.transferredAt ? new Date(s.transferredAt).toLocaleString('tr-TR') : '—'}</div></div>` : ''}
  `;

  const footer = document.getElementById('detail-footer');
  const canTransfer = s.status !== 'Aktarıldı';
  footer.innerHTML = `
    <button class="btn btn-danger btn-sm" onclick="deleteSubmission(${s.id})">🗑️ Sil</button>
    <div style="flex:1"></div>
    ${(!s.status || s.status === 'Yeni') ? `<button class="btn btn-outline btn-sm" onclick="markSeen(${s.id})">👁️ İncelendi İşaretle</button>` : ''}
    ${canTransfer ? `<button class="btn btn-primary" onclick="openOrderFormEditor(${s.id})">📝 Sipariş Formuna Aktar</button>` : `<span style="font-size:12px;color:var(--success);font-weight:700;align-self:center">✅ Bu talep zaten işleme alındı</span>`}
  `;

  document.getElementById('detail-modal').querySelector('.modal-box').classList.remove('wide');

  document.getElementById('detail-modal').classList.add('open');

  // Modal açıldığında henüz "Yeni" ise otomatik "İncelendi" yap (silent, arka planda)
  if (!silentRefresh && (!s.status || s.status === 'Yeni')) {
    markSeen(s.id, true);
  }
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
  _openDetailId = null;
  _currentDetailView = null;
}

// Dosya/klasör adlarında sorun çıkarabilecek karakterleri temizler
function _sanitizeFolderFileName(s) {
  return String(s||'').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim() || 'dosya';
}

// Hekim/hasta/iş bilgilerini okunaklı bir metin haline getirir — indirilen
// klasörün içine "Siparis_Bilgisi.txt" olarak eklenir.
function _buildSubmissionInfoText(s) {
  const teeth = Array.isArray(s.teeth) ? s.teeth.slice().sort((a,b)=>a-b) : [];
  const jaw = jawLabel(s);
  const dt = s.createdAt ? new Date(s.createdAt).toLocaleString('tr-TR', {dateStyle:'long', timeStyle:'short'}) : '—';
  const jobTypeList = Array.isArray(s.jobTypes) && s.jobTypes.length
    ? s.jobTypes
    : (s.jobType ? [{ type: s.jobType, qty: teeth.length || 1 }] : []);
  const jobTypeStr = jobTypeList.length
    ? jobTypeList.map(jt => jt.qty > 1 ? `${jt.type} ×${jt.qty}` : jt.type).join(', ')
    : '—';
  const lines = [
    'DIGICAD DENTAL LABORATUVAR — HEKİM PORTALI SİPARİŞ BİLGİSİ',
    '='.repeat(56),
    `Hekim         : ${s.doctorName || '—'}`,
    `Hasta         : ${s.patient || '—'}`,
    `Çene          : ${jaw || '—'}`,
    `Dişler        : ${teeth.length ? teeth.join(', ') : '—'}`,
    `Diş Rengi     : ${s.color || '—'}`,
    `İş Türü       : ${jobTypeStr}`,
    `Gönderim Tarihi: ${dt}`,
    `Durum         : ${statusLabel(s).replace(/^[^ ]+ /, '')}`,
    '',
    'Notlar:',
    s.notes ? s.notes : '—',
    '',
    'Bu klasördeki dosyalar:',
    ...(Array.isArray(s.files) ? s.files.map((f,i) => `  ${i+1}. ${f.name}`) : ['  —'])
  ];
  return lines.join('\r\n');
}

// Bir hekim talebine ait TÜM dosyaları (ve sipariş bilgi metnini) TEK BİR ZIP
// arşivinde toplayıp tek seferde indirir. Ayrı ayrı indirme denendiğinde
// tarayıcılar hem art arda gelen otomatik indirmeleri engelleyebiliyor hem de
// farklı kaynaktan (Firebase Storage) gelen dosyalarda özel dosya adını/klasör
// yolunu yok sayabiliyordu — ZIP'e paketleyip TEK dosya olarak indirmek bu iki
// sorunu da kökten çözüyor ve tüm dosyalar gerçekten "bütün halinde" iniyor.
async function downloadAllSubmissionFiles(id) {
  const s = submissions.find(x => x.id === id);
  if (!s) { toast('Kayıt bulunamadı!', 'error'); return; }
  const files = Array.isArray(s.files) ? s.files : [];
  if (!files.length) { toast('Bu talepte indirilecek dosya yok', 'info'); return; }
  if (typeof JSZip === 'undefined') { toast('ZIP kütüphanesi yüklenemedi — internet bağlantınızı kontrol edin', 'error'); return; }

  const folderName = _sanitizeFolderFileName(`${s.doctorName || 'Hekim'}_${s.patient || 'Hasta'}`);
  toast(`📦 ${files.length} dosya hazırlanıyor, lütfen bekleyin…`, 'info');

  try {
    const zip = new JSZip();
    const folder = zip.folder(folderName);
    folder.file('Siparis_Bilgisi.txt', _buildSubmissionInfoText(s));

    let ok = 0;
    for (const f of files) {
      try {
        const resp = await fetch(f.url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        folder.file(_sanitizeFolderFileName(f.name), blob);
        ok++;
      } catch (err) {
        console.error('Dosya indirilemedi:', f.name, err);
        folder.file(_sanitizeFolderFileName(f.name) + '_INDIRILEMEDI.txt',
          `Bu dosya otomatik paketlenemedi.\nDosya adı: ${f.name}\nBağlantı: ${f.url}\nHata: ${err.message}\n\nBu bağlantıyı tarayıcınızda açarak dosyayı manuel indirebilirsiniz.`);
      }
    }

    const zipBlob = await zip.generateAsync({type: 'blob'});
    const zipUrl = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = zipUrl;
    a.download = `${folderName}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(zipUrl), 15000);

    if (ok === files.length) {
      toast(`✅ ${files.length} dosya "${folderName}.zip" olarak indirildi`, 'success');
    } else {
      toast(`⚠️ ${ok}/${files.length} dosya paketlendi — bazı dosyalara ulaşılamadı, ZIP içindeki bilgilendirme dosyasına bakın`, 'error');
    }
  } catch (err) {
    console.error('ZIP oluşturma hatası:', err);
    toast('❌ İndirme paketi oluşturulamadı: ' + err.message, 'error');
  }
}

let _of2JobTypePrices = [];
function _of2JtOptionsHTML() {

    : '';

function _appendOf2JobTypeLine(typeVal, qtyVal) {
  const container = document.getElementById('of2-jobtype-lines');
  const div = document.createElement('div');
  div.className = 'of2-jt-line';
  div.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  const typeField = _of2JobTypePrices.length
    ? `<select class="of2-jt-type of-input" style="font-size:13px;border:1px solid #dbe3ee;border-radius:6px;padding:6px 8px" onchange="onOf2JobTypeLineChange(this)">${_of2JtOptionsHTML()}</select>`
    : `<input class="of2-jt-type of-input" style="font-size:13px;border:1px solid #dbe3ee;border-radius:6px;padding:6px 8px" placeholder="Kron, Köprü, Zirkonya..." oninput="onOf2JobTypeLineChange(this)">`;
  div.innerHTML = `${typeField}
    <input type="number" class="of2-jt-qty" min="1" value="${qtyVal||1}" title="Adet" style="width:64px;flex-shrink:0;border:1px solid #dbe3ee;border-radius:6px;font-size:12.5px;font-weight:700;text-align:center;padding:6px 4px">
    <button type="button" onclick="removeOf2JobTypeLine(this)" title="Bu kalemi kaldır" style="width:28px;height:28px;flex-shrink:0;border-radius:6px;border:1px solid #dbe3ee;background:#fff;color:#e53935;font-weight:700;cursor:pointer">✕</button>`;
  container.appendChild(div);

  const typeEl = div.querySelector('.of2-jt-type');
  if (typeVal) {
    if (typeEl.tagName === 'SELECT') {
      let matched = Array.from(typeEl.options).find(o => o.value === typeVal) ||
        Array.from(typeEl.options).find(o => (o.value||'').toLocaleUpperCase('tr-TR') === typeVal.toLocaleUpperCase('tr-TR'));
      if (!matched) {
        matched = document.createElement('option');
        matched.value = typeVal;
        matched.textContent = typeVal.toLocaleUpperCase('tr-TR') + ' (hekimin seçtiği)';
        typeEl.appendChild(matched);
      }
      typeEl.value = matched.value;
    } else {
      typeEl.value = typeVal;
    }
    onOf2JobTypeLineChange(typeEl);
  }
  syncOf2JobTypeRemoveButtons();
}
function addOf2JobTypeLine() { _appendOf2JobTypeLine('', ''); }
function removeOf2JobTypeLine(btn) {
  const line = btn.closest('.of2-jt-line');
  if (line) line.remove();
  syncOf2JobTypeRemoveButtons();
}
function syncOf2JobTypeRemoveButtons() {
  const lines = document.querySelectorAll('#of2-jobtype-lines .of2-jt-line');
  lines.forEach(l => {
    const b = l.querySelector('button');
    if (b) b.style.visibility = lines.length > 1 ? 'visible' : 'hidden';
  });
}
function onOf2JobTypeLineChange(el) {
  const typeName = (el.value || '').toLocaleUpperCase('tr-TR');
  const alreadyChecked = document.querySelector('input[name="of2-material"]:checked');
  if (typeName && !alreadyChecked) {
    const guess = ORDER_MATERIALS.find(m => typeName.includes(m.split(' ')[0]));
    if (guess) {
      const radio = document.querySelector(`input[name="of2-material"][value="${guess.replace(/"/g,'\\"')}"]`);
      if (radio) radio.checked = true;
    }
  }
}
// DOM'daki satırlardan geçerli (türü dolu) iş kalemlerini fiyat bilgisiyle birlikte okur
function getOf2JobTypeLines() {
  return Array.from(document.querySelectorAll('#of2-jobtype-lines .of2-jt-line')).map(l => {
    const typeEl = l.querySelector('.of2-jt-type');
    const qtyEl = l.querySelector('.of2-jt-qty');
    let price = 0, currency = 'TRY';
    if (typeEl.tagName === 'SELECT') {
      const opt = typeEl.options[typeEl.selectedIndex];
      if (opt && opt.dataset.p) { price = parseFloat(opt.dataset.p) || 0; currency = opt.dataset.c || 'TRY'; }
    }
    return { type: (typeEl.value||'').trim(), qty: parseInt(qtyEl.value)||1, price, currency };
  }).filter(x => x.type);
}

function _readOrderFormEditor(id) {
  const s = submissions.find(x => x.id === id);
  const teeth = Array.isArray(s.teeth) ? s.teeth.slice().sort((a,b)=>a-b) : [];
  const matInput = document.querySelector('input[name="of2-material"]:checked');
  const jobTypeLines = getOf2JobTypeLines();

      .then(snap => {
        const data = snap.val() || {};
        Object.keys(data).forEach(key => {
          rtdb.ref(`${dbRoot}/orderForms/${key}`).update({ printed: true, printedAt: new Date().toISOString() }).catch(()=>{});
        });
      }).catch(()=>{});
  } else if (_lastSubmittedOrderFormJobId) {
    rtdb.ref(`${dbRoot}/orderForms/${_lastSubmittedOrderFormJobId}`).update({ printed: true, printedAt: new Date().toISOString() }).catch(()=>{});
  }
}

// ✅ Onaya Gönder: admin panelindeki "pendingJobs" + "orderForms" akışına
//    BİREBİR aynı şemayla yazar — böylece iki panel tam entegre çalışır.
//    Birden fazla iş kalemi girildiyse (örn. titanyum + üzeri zirkonyum),
//    her kalem AYRI bir pendingJob/orderForm kaydı olarak, ortak bir
//    orderGroupId ile birbirine bağlı şekilde gönderilir.
function submitOrderFormFromSubmission(id) {
  const f = _readOrderFormEditor(id);
  if (!f.patient) { toast('Hasta adı boş olamaz!', 'error'); document.getElementById('of2-patient').focus(); return; }

  const lines = f.jobTypeLines.length ? f.jobTypeLines : [{ type: '', qty: f.qty, price: 0, currency: 'TRY' }];
  const multiLine = lines.length > 1;
  const groupId = Date.now();
  const files = Array.isArray(f.s.files) ? f.s.files : [];
  // Bu hekim için "Otomatik Teknisyen" tanımlıysa, iş onay beklemeden doğrudan
  // o teknisyene atanmış olarak devam eden işlere düşer.
  const drRecord = f.s.drId ? doctorsById[f.s.drId] : null;
  const autoTech = drRecord && drRecord.autoTechId ? techniciansById[drRecord.autoTechId] : null;

  const writes = [];
  const createdIds = [];

  lines.forEach((line, idx) => {
    const jobId = groupId + idx;
    const finalType = line.type || f.material || 'Belirsiz';

    let combinedNote = '';
    if (f.teeth.length) combinedNote += `DİŞLER: ${f.teeth.join(', ')}\n`;
    if (f.material && f.material !== line.type) combinedNote += `MATERYAL: ${f.material}\n`;
    if (multiLine) combinedNote += `KALEM: ${idx+1}/${lines.length} — aynı siparişin parçası\n`;
    if (f.notes) combinedNote += f.notes;
    combinedNote = combinedNote.trim();

    if (autoTech) {
      // Onay adımı atlanır — doğrudan gerçek iş kaydı (jobs) oluşturulur
      const job = {
        id: jobId,
        drId: f.s.drId || null,
        drName: f.doctorName,
        patient: f.patient,
        type: finalType,
        price: line.price || 0,
        currency: line.currency || 'TRY',
        qty: line.qty || 1,
        dateout: f.dateout,
        techId: autoTech.id,
        techName: autoTech.name,
        toothColor: f.color,
        status: 'Bekliyor',
        deleted: false,
        approvedFrom: null,
        approvedAt: new Date().toISOString(),
        note: combinedNote,
        files,
        sourceDoctorSubmissionId: id,
        orderGroupId: multiLine ? groupId : null,
        orderGroupIndex: multiLine ? idx : null,
        orderGroupTotal: multiLine ? lines.length : null,
        orderForm: { teeth: f.teeth, material: f.material, jobType: finalType, doctorName: f.doctorName, color: f.color, notes: f.notes },
        autoAssigned: true
      };
      writes.push(rtdb.ref(`${dbRoot}/jobs/${jobId}`).set(job));
    } else {
      const pendingJob = {
        id: jobId,
        drId: f.s.drId || null,
        drName: f.doctorName,
        patient: f.patient,
        type: finalType,
        price: line.price || 0,
        currency: line.currency || 'TRY',
        qty: line.qty || 1,
        dateout: f.dateout,
        toothColor: f.color,
        techId: null,
        techName: 'Hekim Portalı',
        note: combinedNote,
        files,
        sourceDoctorSubmissionId: id, // Hekim Portalı'ndaki gerçek zamanlı durum takibi için
        orderGroupId: multiLine ? groupId : null,
        orderGroupIndex: multiLine ? idx : null,
        orderGroupTotal: multiLine ? lines.length : null,
        orderForm: {
          teeth: f.teeth, material: f.material, jobType: finalType,
          doctorName: f.doctorName, color: f.color, notes: f.notes
        },
        submittedBy: 'doctorPortal',
        submittedAt: new Date().toISOString(),
        status: 'Onay Bekliyor'
      };
      writes.push(rtdb.ref(`${dbRoot}/pendingJobs/${jobId}`).set(pendingJob));
    }

    // Admin panelindeki "Geçmiş Sipariş Formları" listesinde de görünmesi için
    // aynı kalıcı arşiv kaydı (orderForms) da oluşturulur.
    const orderFormRecord = {
      id: jobId,
      createdAt: new Date().toISOString(),
      drId: f.s.drId || null,
      drName: f.doctorName,
      patient: f.patient,
      jobType: finalType,
      material: f.material,
      finalType,
      color: f.color,
      qty: line.qty || 1,
      dateout: f.dateout,
      notes: f.notes,
      teeth: f.teeth,
      price: line.price || 0,
      currency: line.currency || 'TRY',
      pendingJobId: autoTech ? null : jobId,
      printed: false,
      printedAt: null,
      source: 'gelenIslerPaneli',
      orderGroupId: multiLine ? groupId : null,
      orderGroupIndex: multiLine ? idx : null,
      orderGroupTotal: multiLine ? lines.length : null
    };

    writes.push(rtdb.ref(`${dbRoot}/orderForms/${jobId}`).set(orderFormRecord));
    createdIds.push(jobId);
  });

  const btn = document.getElementById('of2-submit-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Gönderiliyor…'; }

  Promise.all(writes)
    .then(() => rtdb.ref(`${dbRoot}/doctorSubmissions/${id}`).update({ status: 'Aktarıldı', transferredAt: new Date().toISOString() }))
    .then(() => {
      _lastSubmittedOrderFormJobId = createdIds[0];
      _lastSubmittedOrderGroupId = multiLine ? groupId : null;
      toast(autoTech
        ? `⚡ ${lines.length > 1 ? lines.length + ' kalem' : 'İş'} onay beklemeden doğrudan ${autoTech.name}'e atandı — Devam Eden İşler'de görünüyor`
        : (multiLine
            ? `📤 ${lines.length} kalem, ${lines.length} ayrı iş olarak onay bekleyen işlere gönderildi — şimdi yazdırabilirsiniz`
            : '📤 Sipariş onay bekleyen işlere gönderildi — şimdi yazdırabilirsiniz'), 'success');

      // Admin panelindeki davranışın AYNISI: gönderildikten sonra modal kapanmaz,
      // "Yazdır" butonu aktif olur, "Onaya Gönder" ise tekrar basılamasın diye kilitlenir.
      if (btn) {
        btn.disabled = true; btn.innerHTML = '✅ Gönderildi';
        btn.style.opacity = '.7'; btn.style.cursor = 'not-allowed';
        btn.title = 'Bu sipariş zaten gönderildi';
      }
      const printBtn = document.getElementById('of2-print-btn');
      if (printBtn) {
        printBtn.disabled = false;
        printBtn.style.opacity = '1';
        printBtn.style.cursor = 'pointer';
        printBtn.title = 'Sipariş formunu yazdır';
      }
    })
    .catch(err => {
      console.error(err);
      toast('❌ Gönderim başarısız: ' + err.message, 'error');
      if (btn) { btn.disabled = false; btn.innerHTML = '✅ Onaya Gönder'; }
    });
}

let _lastSubmittedOrderFormJobId = null;
let _lastSubmittedOrderGroupId = null;

document.getElementById('detail-modal').addEventListener('click', e => {
  if (e.target.id === 'detail-modal') closeDetailModal();
});
</script>
